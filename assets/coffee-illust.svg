<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="400" fill="#1c1008"/>
  <!-- Warm glow -->
  <circle cx="200" cy="220" r="160" fill="rgba(160,100,40,.1)"/>
  <!-- Saucer -->
  <ellipse cx="200" cy="290" rx="100" ry="18" fill="#2a1c0e"/>
  <ellipse cx="200" cy="288" rx="95" ry="15" fill="#382818"/>
  <!-- Cup -->
  <path d="M130,180 L138,270 C142,282 258,282 262,270 L270,180Z" fill="#e8dcc8"/>
  <!-- Cup inner rim -->
  <ellipse cx="200" cy="180" rx="70" ry="20" fill="#f2ead8"/>
  <!-- Coffee surface -->
  <ellipse cx="200" cy="180" rx="62" ry="16" fill="#8a5c30"/>
  <!-- Latte art — rosetta -->
  <g fill="#c4a060" opacity=".7">
    <ellipse cx="200" cy="175" rx="8" ry="12"/>
    <ellipse cx="200" cy="168" rx="14" ry="6" transform="rotate(-5 200 168)"/>
    <ellipse cx="200" cy="178" rx="16" ry="5" transform="rotate(3 200 178)"/>
    <ellipse cx="200" cy="185" rx="12" ry="4"/>
    <path d="M200,165 Q200,192 200,195" stroke="#c4a060" stroke-width="2" fill="none"/>
  </g>
  <!-- Handle -->
  <path d="M270,200 C296,200 300,240 278,250" fill="none" stroke="#e8dcc8" stroke-width="10" stroke-linecap="round"/>
  <!-- Steam -->
  <g stroke="rgba(255,255,255,.1)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M175,152 Q168,120 180,90"/>
    <path d="M200,146 Q192,108 206,72"/>
    <path d="M225,152 Q234,118 220,86"/>
  </g>
  <!-- Beans -->
  <g fill="#30180a">
    <ellipse cx="90" cy="310" rx="14" ry="9" transform="rotate(-30 90 310)"/>
    <line x1="80" y1="310" x2="100" y2="310" stroke="#1a0e04" stroke-width="1.5" transform="rotate(-30 90 310)"/>
    <ellipse cx="320" cy="320" rx="12" ry="8" transform="rotate(20 320 320)"/>
    <line x1="311" y1="320" x2="329" y2="320" stroke="#1a0e04" stroke-width="1.5" transform="rotate(20 320 320)"/>
    <ellipse cx="310" cy="300" rx="10" ry="7" transform="rotate(-15 310 300)"/>
    <line x1="303" y1="300" x2="317" y2="300" stroke="#1a0e04" stroke-width="1.2" transform="rotate(-15 310 300)"/>
  </g>
</svg>
