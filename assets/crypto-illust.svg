<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <rect width="400" height="400" fill="#060c1c"/>
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(60,130,255,.2)"/><stop offset="100%" stop-color="rgba(60,130,255,0)"/></linearGradient>
    <radialGradient id="coinG"><stop offset="0%" stop-color="rgba(240,190,30,.15)"/><stop offset="100%" stop-color="transparent"/></radialGradient>
  </defs>
  <!-- Subtle grid -->
  <g stroke="rgba(60,120,255,.04)" stroke-width=".5">
    <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/><line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <!-- Chart area -->
  <polygon points="0,350 50,320 100,330 150,280 200,250 240,190 280,160 330,110 380,70 400,60 400,400 0,400" fill="url(#areaFill)"/>
  <!-- Chart line -->
  <polyline points="0,350 50,320 100,330 150,280 200,250 240,190 280,160 330,110 380,70" fill="none" stroke="#4a90ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Candlesticks -->
  <g opacity=".5">
    <rect x="52" y="305" width="5" height="16" rx="1" fill="#4aaa60"/><line x1="54.5" y1="300" x2="54.5" y2="325" stroke="#4aaa60" stroke-width=".8"/>
    <rect x="72" y="310" width="5" height="12" rx="1" fill="#cc4444"/><line x1="74.5" y1="306" x2="74.5" y2="326" stroke="#cc4444" stroke-width=".8"/>
    <rect x="92" y="300" width="5" height="20" rx="1" fill="#4aaa60"/><line x1="94.5" y1="294" x2="94.5" y2="326" stroke="#4aaa60" stroke-width=".8"/>
    <rect x="112" y="308" width="5" height="10" rx="1" fill="#4aaa60"/><line x1="114.5" y1="304" x2="114.5" y2="322" stroke="#4aaa60" stroke-width=".8"/>
    <rect x="132" y="290" width="5" height="14" rx="1" fill="#cc4444"/><line x1="134.5" y1="284" x2="134.5" y2="308" stroke="#cc4444" stroke-width=".8"/>
  </g>
  <!-- Coin glow -->
  <circle cx="290" cy="150" r="90" fill="url(#coinG)"/>
  <!-- Bitcoin coin -->
  <circle cx="290" cy="150" r="62" fill="#c49008"/>
  <circle cx="290" cy="150" r="55" fill="#e4b418"/>
  <circle cx="290" cy="150" r="50" fill="none" stroke="#c49008" stroke-width="2"/>
  <!-- B symbol -->
  <g fill="none" stroke="#a07808" stroke-width="5" stroke-linecap="round">
    <path d="M278,128 L278,172"/>
    <path d="M282,128 L296,128 C306,128 310,136 304,140 C312,144 308,154 298,154 L282,154"/>
    <path d="M282,140 L296,140"/>
    <line x1="284" y1="122" x2="284" y2="128"/>
    <line x1="294" y1="122" x2="294" y2="128"/>
    <line x1="284" y1="154" x2="284" y2="160"/>
    <line x1="294" y1="154" x2="294" y2="160"/>
  </g>
  <!-- Network nodes -->
  <g>
    <circle cx="80" cy="100" r="4" fill="#4a90ff" opacity=".4"/>
    <circle cx="140" cy="200" r="3.5" fill="#4a90ff" opacity=".35"/>
    <circle cx="60" cy="260" r="3" fill="#4a90ff" opacity=".25"/>
    <circle cx="370" cy="230" r="3.5" fill="#4a90ff" opacity=".35"/>
    <line x1="80" y1="100" x2="140" y2="200" stroke="#4a90ff" stroke-width=".6" opacity=".12"/>
    <line x1="140" y1="200" x2="290" y2="150" stroke="#4a90ff" stroke-width=".6" opacity=".12"/>
    <line x1="290" y1="150" x2="370" y2="230" stroke="#4a90ff" stroke-width=".6" opacity=".12"/>
    <line x1="60" y1="260" x2="140" y2="200" stroke="#4a90ff" stroke-width=".6" opacity=".1"/>
  </g>
</svg>
